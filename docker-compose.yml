services:
  postgres:
    image: postgres:16
    container_name: kcpec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kcpec
      POSTGRES_USER: kcpec
      POSTGRES_PASSWORD: kcpec1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kcpec -d kcpec"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
